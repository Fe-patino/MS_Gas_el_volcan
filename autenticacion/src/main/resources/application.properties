spring.application.name=ms-autenticacion
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/db_autenticacion
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
springdoc.swagger-ui.path=/swagger-ui.html
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.defer-datasource-initialization=true

# Registro en Eureka (en Docker se sobrescribe con EUREKA_URL)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Secreto con el que se firma/valida el JWT
jwt.secreto=${JWT_SECRETO:gasElVolcanClaveSecreta2024XYZ123456789}
